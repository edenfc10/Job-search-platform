<!DOCTYPE html>
<html>
<head><title>Apply — DataStream</title></head>
<body>
<h1>Apply for Backend Engineer at DataStream</h1>
<form action="/submit/datastream" method="post" enctype="multipart/form-data">
  <label for="full_name">Full name</label>
  <input type="text" id="full_name" name="full_name" required />

  <label for="email">Email</label>
  <input type="email" id="email" name="email" required />

  <label for="resume">Upload resume</label>
  <input type="file" id="resume" name="resume" required />

  <label for="salary">What are your salary expectations?</label>
  <input type="text" id="salary" name="salary" required />

  <input type="submit" value="Apply" />
</form>
</body>
</html>
