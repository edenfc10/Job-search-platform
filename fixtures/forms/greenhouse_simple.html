<!DOCTYPE html>
<html>
<head><title>Apply — Cloudify</title></head>
<body class="greenhouse-app">
<h1>Apply for Senior Backend Engineer at Cloudify</h1>
<form action="/submit/cloudify" method="post" enctype="multipart/form-data">
  <label for="full_name">Full name</label>
  <input type="text" id="full_name" name="full_name" required />

  <label for="email">Email address</label>
  <input type="email" id="email" name="email" required />

  <label for="phone">Phone</label>
  <input type="tel" id="phone" name="phone" />

  <label for="linkedin">LinkedIn URL</label>
  <input type="url" id="linkedin" name="linkedin" />

  <label for="resume">Resume / CV</label>
  <input type="file" id="resume" name="resume" required />

  <label for="why">Why do you want to work here?</label>
  <textarea id="why" name="why"></textarea>

  <input type="hidden" name="csrf" value="abc123" />
  <input type="submit" value="Submit Application" />
</form>
</body>
</html>
